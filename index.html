<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASCII Art</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f7f6f2;color:#171717;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overscroll-behavior-x:none}
main{width:min(760px,100%);margin:0 auto;padding:28px 14px}.panel{background:#fff;border:1px solid #e6e3dc;border-radius:22px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.035);margin-bottom:12px}
.drop{display:flex;align-items:center;justify-content:center;min-height:66px;border:1px dashed #cfcac0;border-radius:16px;cursor:pointer;font-size:16px;font-weight:650;color:#777;background:#fff;transition:.2s}.drop:hover{border-color:#aaa;background:#fafaf8}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}label{display:block;font-size:13px;color:#777;line-height:1.4}label input,label select{margin-top:6px}
input[type=range]{width:100%;accent-color:#111}input[type=color]{width:100%;height:48px;margin-top:6px;border:1px solid #ddd8d0;border-radius:13px;padding:4px;background:#fff}
select,button{width:100%;height:48px;margin-top:6px;padding:0 12px;border-radius:13px;border:1px solid #ddd8d0;background:#fff;color:#181818;font-family:inherit;font-size:16px;letter-spacing:-.02em}button{cursor:pointer;font-weight:700}button:active{transform:scale(.99)}
.preview{min-height:420px;display:flex;align-items:center;justify-content:center;overflow:auto;border-radius:17px;background-color:#f1f1ee;background-image:linear-gradient(45deg,#e7e7e3 25%,transparent 25%),linear-gradient(-45deg,#e7e7e3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e7e7e3 75%),linear-gradient(-45deg,transparent 75%,#e7e7e3 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0;position:relative}
.zoombar{display:grid;grid-template-columns:48px 1fr 48px 64px;align-items:center;gap:6px;margin-top:10px}.zoombar button{padding:0;height:42px;margin-top:0}.zoombar span{font-size:12px;color:#888;text-align:center}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.buttons button{margin-top:0}
@media(max-width:560px){main{padding:16px 10px 24px}.controls{grid-template-columns:1fr 1fr}.preview{min-height:400px}}
#reset{background:#fff!important;color:#2196f3!important;border-color:#111!important}
</style></head><body><main>
<section class="panel"><div class="preview" id="preview"></div><div class="zoombar"><button id="zoomOut">−</button><span id="zoomVal">100%</span><button id="zoomIn">+</button><button id="zoomReset">100%</button></div></section>
<section class="panel"><div class="drop" id="drop">📷 사진 업로드<input id="file" type="file" accept="image/*" hidden></div>
<div class="controls">
<label>반복할 단어<input id="word" type="text" maxlength="30" placeholder="예: LOVE"></label>
<label>ASCII 문자 세트<select id="chars">
<option value="@%#*+=-:. ">@%#*+=-:. · 기본 밀도</option><option value=" .:-=+*#%@"> .:-=+*#%@ · 반전 밀도</option><option value="█▓▒░ ">█▓▒░ · 블록</option><option value="@#8&o:*. ">@#8&o:*. · 클래식</option><option value="@$B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,^ ">디테일</option><option value="01 ">01 · 바이너리</option><option value="0123456789 ">0123456789 · 숫자</option><option value="ABCDEF0123456789 ">ABCDEF0123456789 · HEX</option><option value="░▒▓█ ">░▒▓█ · 음영</option><option value="▁▂▃▄▅▆▇█ ">▁▂▃▄▅▆▇█ · 세로 블록</option><option value="·•●○◦⋅∙ ">·•●○◦⋅∙ · 도트</option><option value="× ">× · X 심볼</option><option value="✕ ">✕ · 가는 X 심볼</option><option value="✖ ">✖ · 굵은 X 심볼</option><option value="░▒▓█▌▐▀▄ ">░▒▓█▌▐▀▄ · 픽셀</option><option value="♥♡★☆◆◇■□●○▲△▼▽ ">♥♡★☆◆◇■□●○▲△▼▽ · 기호</option><option value="!@#$%^&*()_+-=[]{};:,.<>/?\\|~ ">특수문자</option>
</select></label>
<label>적용 범위<select id="subject"><option value="person" selected>인물만</option><option value="all">전체 이미지</option></select></label>
<label>가로 문자 수 <span id="widthVal">100</span><input id="width" type="range" min="40" max="220" value="100"></label>
<label>밝기 <span id="brightVal">0</span><input id="bright" type="range" min="-100" max="100" value="0"></label>
<label>대비 <span id="contrastVal">100</span><input id="contrast" type="range" min="0" max="200" value="100"></label>
<label>문자 색상<input id="fg" type="color" value="#111111"></label>
<label>배경<select id="bgMode"><option value="transparent">투명</option><option value="color">색상</option></select></label>
<label id="bgColorWrap" hidden>배경 색상<input id="bg" type="color" value="#ffffff"></label>
</div><div class="buttons"><button id="save">PNG 저장</button><button id="reset">초기화</button></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
<script>
const $=s=>document.querySelector(s);let img=null,lastText="",zoom=1,personMask=null,segmenter=null;
const file=$('#file'),drop=$('#drop'),preview=$('#preview');
drop.onclick=()=>file.click();drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#111'};drop.ondragleave=()=>drop.style.borderColor='';drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';load(e.dataTransfer.files[0])};file.onchange=e=>load(e.target.files[0]);
['width','bright','contrast'].forEach(id=>$('#'+id).oninput=()=>{updateLabels();saveSettings();render()});['chars','word','fg','bg'].forEach(id=>$('#'+id).oninput=()=>{saveSettings();render()});
$('#bgMode').onchange=()=>{$('#bgColorWrap').hidden=$('#bgMode').value!=='color';saveSettings();updatePreviewBackground();render()};$('#subject').onchange=async()=>{saveSettings();if($('#subject').value==='person'&&img)await makePersonMask();render()};
function updateLabels(){$('#widthVal').textContent=$('#width').value;$('#brightVal').textContent=$('#bright').value;$('#contrastVal').textContent=$('#contrast').value}
const DB_NAME='ascii-art-db',DB_STORE='state';
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(DB_STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function savePersistedImage(src){try{const db=await openDB();db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).put(src,'image')}catch(e){}}
async function getPersistedImage(){try{const db=await openDB();return await new Promise((resolve,reject)=>{const req=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get('image');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}catch(e){return null}}
function saveSettings(){try{localStorage.setItem('ascii-settings',JSON.stringify({word:$('#word').value,chars:$('#chars').value,subject:$('#subject').value,width:$('#width').value,bright:$('#bright').value,contrast:$('#contrast').value,fg:$('#fg').value,bgMode:$('#bgMode').value,bg:$('#bg').value}))}catch(e){}}
function restoreSettings(){try{const s=JSON.parse(localStorage.getItem('ascii-settings')||'null');if(!s)return;for(const [id,value] of Object.entries(s)){const el=$('#'+id);if(el&&value!==undefined)el.value=value}$('#bgColorWrap').hidden=$('#bgMode').value!=='color';updateLabels()}catch(e){}}
function load(f,persist=true){if(!f||!f.type.startsWith('image/'))return;const objectUrl=URL.createObjectURL(f);img=new Image();img.onload=async()=>{URL.revokeObjectURL(objectUrl);personMask=null;if(persist){try{const reader=new FileReader();reader.onload=()=>savePersistedImage(reader.result);reader.readAsDataURL(f)}catch(e){}}if($('#subject').value==='person')await makePersonMask();render()};img.src=objectUrl}
async function makePersonMask(){if(!window.SelfieSegmentation)return;if(!segmenter){segmenter=new SelfieSegmentation({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`});segmenter.setOptions({modelSelection:1})}await new Promise(resolve=>{segmenter.onResults(results=>{const m=document.createElement('canvas'),x=m.getContext('2d');m.width=img.naturalWidth;m.height=img.naturalHeight;x.drawImage(results.segmentationMask,0,0,m.width,m.height);personMask=m;resolve()});segmenter.send({image:img})})}
function adjust(v){let b=+$('#bright').value,c=+$('#contrast').value;return Math.max(0,Math.min(255,(v-128)*(c/100)+128+b))}
function updatePreviewBackground(){preview.style.background=$('#bgMode').value==='color'?$('#bg').value:''}
function drawGridToCanvas(grid,w,h,font,fg,bgColor,scale=1){const cellW=font*.6,c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*cellW*scale));c.height=Math.max(1,Math.ceil(h*font*scale));const ctx=c.getContext('2d');if(bgColor){ctx.fillStyle=bgColor;ctx.fillRect(0,0,c.width,c.height)}ctx.font=(font*scale)+'px monospace';ctx.textBaseline='top';ctx.textAlign='left';for(let y=0;y<h;y++)for(let x=0;x<w;x++){const cell=grid[y][x],ch=typeof cell==='object'?cell.ch:cell;if(ch===' ')continue;const measured=Math.max(1,ctx.measureText(ch).width),target=cellW*scale,tone=typeof cell==='object'?cell.tone:1;ctx.save();ctx.globalAlpha=tone;ctx.fillStyle=fg;ctx.translate(x*cellW*scale,y*font*scale);ctx.scale(target/measured,1);ctx.fillText(ch,0,0);ctx.restore()}ctx.globalAlpha=1;return c}
function render(){if(!img)return;const w=+$('#width').value,h=Math.max(1,Math.round(w*(img.height/img.width)*.6)),cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});cv.width=w;cv.height=h;x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h).data,chars=$('#chars').value;let mask=null;if($('#subject').value==='person'&&personMask){const mc=document.createElement('canvas'),mx=mc.getContext('2d',{willReadFrequently:true});mc.width=w;mc.height=h;mx.drawImage(personMask,0,0,w,h);mask=mx.getImageData(0,0,w,h).data}const word=[...$('#word').value.trim()],grid=Array.from({length:h},()=>Array.from({length:w},()=>({ch:' ',tone:0})));let wordPos=0;
for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const i=(y*w+xx)*4;if(mask&&mask[i]<100)continue;const lum=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2],v=adjust(lum);if(word.length){const darkness=Math.max(0,Math.min(1,(255-v)/255));if(darkness<.12){grid[y][xx].ch=' ';grid[y][xx].tone=0}else{grid[y][xx].ch=word[wordPos%word.length];grid[y][xx].tone=Math.max(.12,Math.pow(darkness,.48));wordPos++}}else{const idx=Math.min(chars.length-1,Math.floor((v/255)*(chars.length-1)));grid[y][xx].ch=chars[idx];grid[y][xx].tone=grid[y][xx].ch===' '?0:1}}
lastText=grid.map(row=>row.map(cell=>cell.ch).join('')).join('\n');const old=$('#asciiStage');if(old)old.remove();const stage=document.createElement('div');stage.id='asciiStage';stage.style.background=$('#bgMode').value==='color'?$('#bg').value:'transparent';stage.style.padding='28px';stage.style.width='100%';stage.style.display='flex';stage.style.alignItems='center';stage.style.justifyContent='center';stage.style.overflow='hidden';const font=Math.max(4,Math.min(16,720/w)),asciiCanvas=drawGridToCanvas(grid,w,h,font,$('#fg').value,$('#bgMode').value==='color'?$('#bg').value:null);asciiCanvas.id='asciiCanvas';asciiCanvas.style.display='block';asciiCanvas.style.maxWidth='100%';asciiCanvas.style.height='auto';stage.appendChild(asciiCanvas);preview.appendChild(stage);applyZoom();updatePreviewBackground()}
function applyZoom(){const stage=$('#asciiStage');if(stage){stage.style.transform='scale('+zoom+')';stage.style.transformOrigin='center center';stage.style.maxWidth='100%'}$('#zoomVal').textContent=Math.round(zoom*100)+'%'}
$('#zoomIn').onclick=()=>{zoom=Math.min(4,zoom+.25);applyZoom()};$('#zoomOut').onclick=()=>{zoom=Math.max(.25,zoom-.25);applyZoom()};$('#zoomReset').onclick=()=>{zoom=1;applyZoom()};
$('#reset').onclick=async()=>{try{localStorage.removeItem('ascii-settings');const db=await openDB();db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).delete('image')}catch(e){}location.reload()};
async function ensureMinSize(blob,min=512000){if(blob.size>=min)return blob;return new Promise(resolve=>{const img2=new Image(),u=URL.createObjectURL(blob);img2.onload=()=>{URL.revokeObjectURL(u);const c=document.createElement('canvas'),ctx=c.getContext('2d'),scale=Math.max(1,Math.sqrt(min/blob.size));c.width=Math.ceil(img2.width*scale);c.height=Math.ceil(img2.height*scale);ctx.drawImage(img2,0,0,c.width,c.height);c.toBlob(b=>resolve(b&&b.size>=min?b:blob),'image/png')};img2.onerror=()=>{URL.revokeObjectURL(u);resolve(blob)};img2.src=u})}
$('#save').onclick=async()=>{if(!lastText)return;const lines=lastText.split('\n'),font=Math.max(12,Math.min(28,3600/(+$('#width').value))),w=+$('#width').value,h=lines.length,grid=Array.from({length:h},(_,y)=>Array.from({length:w},(_,x)=>({ch:[...(lines[y]||'')][x]||' ',tone:1}))),c=drawGridToCanvas(grid,w,h,font,$('#fg').value,$('#bgMode').value==='color'?$('#bg').value:null,2),raw=await new Promise(r=>c.toBlob(r,'image/png')),blob=await ensureMinSize(raw,512000),a=document.createElement('a');a.download='ascii-art.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
(async()=>{restoreSettings();updateLabels();updatePreviewBackground();const persisted=await getPersistedImage();if(persisted){try{const blob=await(await fetch(persisted)).blob();load(new File([blob],'saved-image.png',{type:blob.type}),false)}catch(e){}}})();
</script></body></html>
